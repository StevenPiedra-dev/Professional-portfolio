<nav class="navbar" [class.scrolled]="isScrolled()" [class.admin-mode]="isAdmin" role="navigation" aria-label="Main navigation">
  <div class="nav-container">

    <!-- BRAND LOGO & TITLE -->
    <a class="nav-brand" [routerLink]="isAdmin ? null : '/'" (click)="closeMenu()" aria-label="Steven Piedra Villalta - Home">
      <div class="logo-wrapper" (click)="onLogoClick($event)" title="{{ isAdmin ? 'Triple-clic para volver a vista usuario' : 'Steven Piedra Villalta' }}">
        <img src="assets/sp-logo.svg" alt="SP Logo" class="brand-img" />
        <span class="admin-badge" *ngIf="isAdmin">ADMIN</span>
      </div>
      <div class="brand-text">
        <span class="brand-name">Steven Piedra Villalta</span>
        <span class="brand-subtitle" *ngIf="!isAdmin">Full Stack Developer | AI Developer | Product Manager</span>
        <span class="brand-subtitle admin-subtitle" *ngIf="isAdmin">🛡️ Vista Administrador — Triple-clic para salir</span>
      </div>
    </a>

    <!-- MOBILE HAMBURGER BUTTON -->
    <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen()" aria-label="Toggle navigation menu">
      <span class="hamburger" [class.active]="isMenuOpen()"></span>
    </button>

    <!-- NAVIGATION MENU LINKS -->
    <div class="nav-menu" [class.open]="isMenuOpen()">
      <ul class="nav-links" role="list">
        <li *ngFor="let link of navLinks" role="listitem">
          <a
            class="nav-link"
            [class.admin-nav-link]="isAdmin"
            [routerLink]="isAdmin ? null : link.path"
            [routerLinkActive]="isAdmin ? '' : 'active'"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            (click)="onNavLinkClick($event, link.path)"
          >
            {{ link.label }}
          </a>
        </li>
      </ul>

      <!-- LET'S TALK CTA BUTTON - only for user mode -->
      <button *ngIf="!isAdmin" class="nav-cta" (click)="openContactModal()" aria-label="Open contact form">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="cta-icon">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
        <span>Let's Talk</span>
      </button>
    </div>

  </div>
</nav>

<!-- SECRET ADMIN LOGIN MODAL -->
<app-admin-login-modal
  *ngIf="showAdminLogin()"
  (close)="showAdminLogin.set(false)"
></app-admin-login-modal>
